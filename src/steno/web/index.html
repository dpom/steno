<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>translator checker</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <header>
      <label for="path">glyph image or directory</label>
      <input id="path" type="text" spellcheck="false"
             placeholder="/path/to/glyph.png or /path/to/directory">
      <button id="open" type="button">Open</button>
    </header>

    <main>
      <section class="panel glyph-panel" aria-labelledby="glyph-title">
        <h2 id="glyph-title">gliph image</h2>
        <p id="glyph-empty" class="empty">no glyph loaded</p>
        <div id="glyph-grid" class="glyph-grid" hidden>
          <figure>
            <figcaption>original</figcaption>
            <img id="glyph-original" alt="original glyph">
          </figure>
          <figure>
            <figcaption id="glyph-caption">processed</figcaption>
            <img id="glyph-processed" alt="processed glyph">
          </figure>
        </div>
      </section>

      <section class="panel lsigns-panel" aria-labelledby="lsigns-title">
        <h2 id="lsigns-title">lsigns</h2>
        <div class="table-wrap">
          <table id="lsigns">
            <thead>
              <tr>
                <th scope="col">Lsign</th>
                <th scope="col">start</th>
                <th scope="col">freq</th>
                <th scope="col">diff</th>
                <th scope="col">knn</th>
                <th scope="col">select</th>
                <th scope="col">save</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="panel controls-panel">
      <div class="controls">
        <button id="save" type="button">Save</button>
        <button id="prev" type="button">Previous</button>
        <button id="next" type="button">Next</button>
        <button id="delete" type="button">Delete</button>
      </div>
      <div class="status-row">
        <progress id="progress" hidden></progress>
        <span id="status" role="status">Ready</span>
        <span id="position"></span>
      </div>
    </footer>

    <datalist id="letters"></datalist>
    <script src="/app.js"></script>
  </body>
</html>
